name: rails-new-docker

on: [push, pull_request]

permissions:
  contents: read

env:
  APP_NAME: devrails
  APP_PATH: dev/devrails
  BUNDLE_WITHOUT: db:job:cable:storage

jobs:
  rails-new-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Remove Gemfile.lock
      run: rm -f Gemfile.lock
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ruby
        bundler-cache: true
    - name: Generate --dev app
      run: |
        bundle exec railties/exe/rails new $APP_PATH --dev
    - name: Build image
      run: |
        # The generated Dockerfile uses the exact Ruby version of the runner, but the
        # official image for a new Ruby release can lag behind the release by a day or so.
        # Until it is published, build from the minor series tag, which points at the
        # newest published patch release.
        RUBY_VERSION=$(ruby -e "print Gem.ruby_version")
        if ! podman manifest inspect docker.io/library/ruby:$RUBY_VERSION-slim > /dev/null 2>&1; then
          echo "::warning::docker.io/library/ruby:$RUBY_VERSION-slim is not published yet, falling back to ruby:${RUBY_VERSION%.*}-slim"
          RUBY_VERSION=${RUBY_VERSION%.*}
        fi
        podman build -t $APP_NAME \
        --build-arg RUBY_VERSION=$RUBY_VERSION \
        -v $(pwd):$(pwd) \
        -f ./$APP_PATH/Dockerfile \
        ./$APP_PATH
    - name: Run container
      run: |
        podman run --name $APP_NAME \
        --user root \
        -v $(pwd):$(pwd) \
        -e SECRET_KEY_BASE_DUMMY=1 \
        -e DATABASE_URL=sqlite3:storage/production.sqlite3 \
        -p 3000:3000 $APP_NAME &
    - name: Test container
      run: ruby -r ./.github/workflows/scripts/test-container.rb

    - uses: zzak/action-discord@4cd181470664aa174b7252e5afb2ecf896001817 # v8
      continue-on-error: true
      if: failure() && github.ref_name == 'main'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
